[package]
name = "dushan-desktop"
version = "1.2.0"
description = "独山麻将 · 桌面版：内嵌 Rust 服务端 + 宽屏对局"
authors = ["LIGF9"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
offline-core = { path = "../../offline" }

# 导出文件 → macOS 系统分享面板（NSSharingServicePicker）。
# 版本跟随 tauri 已有的依赖树（objc2 0.6 / objc2-* 0.3），不额外拉新版本。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSSharingService", "NSView", "NSResponder", "NSWindow"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
