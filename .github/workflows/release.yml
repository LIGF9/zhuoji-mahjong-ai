name: 构建并发布三端 App

# 三端产物全部由 CI 原生构建并自动发到 GitHub Release，本地无需任何
# GitHub Token：push 一个 v* 标签即可，或在 Actions 页面手动 workflow_dispatch。
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# Windows 用 tauri.windows.conf.json（NSIS + WebView2 引导），
# macOS 用主配置（.app → zip），Android 用 tauri android init 重新生成
# 构建期文件后保留仓库里的自定义 Kotlin / ProGuard / FileProvider 配置。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（如 v1.2.0）'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAURI_CLI_VERSION: 2.12.4
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装 Tauri CLI
        run: npm install -g "@tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}"
      - name: 构建 Windows 安装包
        working-directory: desktop
        shell: pwsh
        run: |
          tauri build --config src-tauri/tauri.windows.conf.json
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::warning::NSIS 打包失败，回退为不带安装包的裸 exe'
            tauri build --config src-tauri/tauri.windows.conf.json --bundles none
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: 收集产物（NSIS 失败时回退裸 exe）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $setup = Get-ChildItem -Path desktop/src-tauri/target/release/bundle/nsis `
              -Filter *.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName 'release-assets/dushan-mahjong-windows-x64-setup.exe'
          } else {
            # 二进制名取决于 Tauri 的 mainBinaryName 策略（可能是 dushan-desktop.exe，
            # 也可能被重命名成 productName），这里按两者都找，找不到就报错退出。
            $bin = Get-ChildItem -Path desktop/src-tauri/target/release -Filter *.exe `
                -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -in @('dushan-desktop.exe', '独山麻将.exe') } |
                Select-Object -First 1
            if (-not $bin) { Write-Error '既没有 NSIS 安装包也没有主程序 exe'; exit 1 }
            Copy-Item $bin.FullName 'release-assets/dushan-mahjong-windows-x64.exe'
          }
          Get-ChildItem release-assets | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release-assets/*
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装 Tauri CLI
        run: npm install -g "@tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}"
      - name: 构建 macOS .app
        working-directory: desktop
        run: tauri build --bundles app
      - name: 打包成可下载的 zip
        run: |
          mkdir -p release-assets
          cd desktop/src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent "独山麻将.app" \
            "$GITHUB_WORKSPACE/release-assets/dushan-mahjong-macos-arm64.zip"
          ls -lh "$GITHUB_WORKSPACE/release-assets"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release-assets/*
          if-no-files-found: error

  # ----------------------------------------------------------------- Android
  android:
    # ubuntu 镜像自带 Android SDK + NDK，比 macOS 镜像更稳、更省构建额度
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Xmx4g -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'tauri-offline/src-tauri -> target'
          key: android-aarch64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装 Tauri CLI
        run: npm install -g "@tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}"
      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "::error::Android SDK 不存在: $SDK"; exit 1; }
          NDK="$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1)"
          test -d "$NDK" || { echo "::error::Android NDK 不存在，检查 $SDK/ndk"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "SDK=$SDK  NDK=$NDK"
      - name: 重新生成 Android 构建期文件，再恢复仓库自定义配置
        working-directory: tauri-offline
        run: |
          # gen/android 里的 tauri.settings.gradle / tauri.build.gradle.kts / jniLibs
          # 是 init 生成的机器相关文件（含本机 cargo 缓存绝对路径），不入库；
          # 入库的是我们改过的 MainActivity.kt / build.gradle.kts / file_paths.xml
          # 等。所以先整体重建，再用仓库版本覆盖回来自定义部分。
          rm -rf src-tauri/gen/android
          tauri android init --ci
          git checkout HEAD -- src-tauri/gen/android
          chmod +x src-tauri/gen/android/gradlew
          test -f src-tauri/gen/android/app/src/main/java/com/zhuoji/mahjong/MainActivity.kt || {
            echo "::error::自定义 MainActivity.kt 没恢复，Android 返回键/分享会失效"; exit 1; }
          grep -q "shareFile" src-tauri/gen/android/app/src/main/java/com/zhuoji/mahjong/MainActivity.kt || {
            echo "::error::MainActivity.kt 缺少 shareFile，说明取到了默认模板"; exit 1; }
      - name: 生成 CI 临时签名密钥（release APK 需可安装）
        working-directory: tauri-offline/src-tauri/gen/android
        run: |
          if [ ! -f keystore.properties ]; then
            keytool -genkeypair -v -keystore ci-debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android CI,O=WorkBuddy,C=CN" >/dev/null 2>&1
            printf 'storeFile=%s\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' \
              "$PWD/ci-debug.keystore" > keystore.properties
          fi
      - name: 构建 arm64 APK
        working-directory: tauri-offline
        run: tauri android build --apk --target aarch64
      - name: 收集 APK
        run: |
          mkdir -p release-assets
          APK="$(find tauri-offline/src-tauri/gen/android/app/build/outputs/apk \
                -name '*.apk' -type f | head -1)"
          test -n "$APK" || { echo "::error::没找到 APK"; exit 1; }
          cp "$APK" 'release-assets/dushan-mahjong-android-arm64.apk'
          ls -lh release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release-assets/*
          if-no-files-found: error

  # ------------------------------------------------------------------ Release
  release:
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: 创建或更新 Release 并上传三端产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          ls -lh assets
          # GitHub 会把 Release 资产名的非 ASCII 字符折叠成 '-'（实测
          # 「独山麻将-Android-arm64.apk」变成「-Android-arm64.apk」），
          # 所以资产统一用 ASCII 名，中文只出现在说明表格与 App 内部。
          files=(assets/*)
          ls -lh "${files[@]}"

          cat > notes.md <<'EOF'
          三端安装包由 GitHub Actions 从本标签源码自动构建，可直接下载：

          | 平台 | 文件 | 说明 |
          | --- | --- | --- |
          | Android | `dushan-mahjong-android-arm64.apk` | 独山麻将 · arm64 真机；CI 临时密钥签名，覆盖安装时需先卸载旧包 |
          | macOS | `dushan-mahjong-macos-arm64.zip` | 独山麻将 · Apple Silicon；解压后把 `独山麻将.app` 拖进「应用程序」 |
          | Windows | `dushan-mahjong-windows-x64-setup.exe` | 独山麻将 · NSIS 安装包，首次运行会引导安装 WebView2 Runtime |

          **未签名提示**：CI 产物没有代码签名证书。macOS 首次打开若提示
          「无法验证开发者」，右键 →「打开」，或在终端执行
          `xattr -dr com.apple.quarantine /Applications/独山麻将.app`。
          Windows SmartScreen 提示「更多信息 → 仍要运行」即可。

          桌面版启动后会在本机 8771 端口起引擎，同一 Wi-Fi 下的手机浏览器
          打开 `http://<电脑IP>:8771/?touch=1` 即可当远程屏幕使用。
          Windows 首次启动若弹出防火墙提示，允许「专用网络」即可。
          EOF
          # heredoc 在 YAML 里带缩进，去掉行首空白，避免 release 说明变成代码块
          sed -i 's/^[[:space:]]*//' notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，追加/覆盖同名资产"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "独山麻将 $TAG" --notes-file notes.md
          fi
          # 清掉旧资产（例如上一版命名规则留下的 -Android-arm64.apk）。
          # 用 REST DELETE 按 id 删：gh release delete-asset 的确认参数在
          # 不同版本里不一致，失败又容易被 || true 吞掉，删不干净。
          gh api "repos/$GH_REPO/releases/tags/$TAG"             --jq '.assets[] | "\(.id) \(.name)"' > stale.txt || true
          while read -r id name; do
            [ -z "$id" ] && continue
            keep=0
            for f in "${files[@]}"; do
              if [ "$(basename "$f")" = "$name" ]; then keep=1; fi
            done
            if [ $keep -eq 0 ]; then
              echo "删除旧资产 $name (#$id)"
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$id"
            fi
          done < stale.txt
          for f in "${files[@]}"; do gh release upload "$TAG" "$f" --clobber; done
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | "\(.name)  \(.size)")'
