[package]
name = "dushan-engine"
version = "0.1.0"
edition = "2021"
description = "独山麻将规则内核（Rust 版），用于替换 Python 牌局模拟"

[lib]
name = "dushan_engine"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "parity"
path = "src/bin/parity.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "bench_sim"
path = "src/bin/bench_sim.rs"

[[bin]]
name = "annotate"
path = "src/bin/annotate.rs"
required-features = ["annotate"]

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]
annotate = ["dep:ort", "dep:zip", "dep:ndarray"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"], optional = true }
numpy = { version = "0.30", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "coreml", "load-dynamic"], optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
ndarray = { version = "0.17", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
