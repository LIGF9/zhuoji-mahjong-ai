[package]
name = "dushan-engine"
version = "0.1.0"
edition = "2021"
description = "独山麻将规则内核（Rust 版），用于替换 Python 牌局模拟"

[lib]
name = "dushan_engine"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "parity"
path = "src/bin/parity.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[bin]]
name = "bench_sim"
path = "src/bin/bench_sim.rs"

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"], optional = true }
numpy = { version = "0.30", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
