<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>独山麻将 · 单机</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="felt" aria-hidden="true"></div>

  <main class="card" id="card">
    <div class="brand">
      <img class="tile" src="splash_tile.png" alt="幺鸡" aria-hidden="true">
      <div class="brand-txt">
        <h1>独山麻将</h1>
        <p>单机版 · 完全离线</p>
      </div>
    </div>

    <div class="boot">
      <div class="bar" role="progressbar" aria-label="本地引擎启动进度"><span id="bar"></span></div>
      <div class="status busy" id="status" role="status" aria-live="polite">正在唤醒本地引擎…</div>
    </div>

    <div class="actions">
      <button id="btn-retry" class="primary" type="button" hidden>重试</button>
    </div>

    <div class="hint" id="hint">
      规则、结算与 AI 推理全部在手机内由 Rust 完成，<strong>断网、飞行模式也能玩</strong>。
      首次启动要加载约 9 MB 模型，通常 2–8 秒。
    </div>

    <footer id="footer">单机离线版 v1.2.0 · 无需服务端、不联网</footer>
  </main>

  <script src="main.js"></script>
</body>
</html>
