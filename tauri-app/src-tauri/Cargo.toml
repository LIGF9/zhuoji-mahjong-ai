[package]
name = "tauri-app"
version = "1.0.0"
description = "独山麻将 · 大师之路 Android 客户端（Tauri 2）"
authors = ["LIGF9"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
